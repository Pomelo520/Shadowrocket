<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomelo's GitHub</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <style>
        :root {
            --bg-body: #ffffff;
            --text-main: #1f2328;
            --text-muted: #656d76;
            --border-default: #d0d7de;
            --border-muted: #d8dee4;
            --link-color: #0969da;
            --code-bg: #f6f8fa;
            --quote-border: #d0d7de;
            --header-border: #d8dee4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0d1117;
                --text-main: #e6edf3;
                --text-muted: #848d97;
                --border-default: #30363d;
                --border-muted: #21262d;
                --link-color: #4493f8;
                --code-bg: #161b22;
                --quote-border: #30363d;
                --header-border: #21262d;
            }
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 8px; 
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-muted);
        }

        .header-content {
            flex: 1;
            min-width: 0;
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.6rem, 6vw, 2.5rem); 
            font-weight: 850;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        header p {
            margin: 2px 0 0 0;
            color: var(--text-muted);
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            line-height: 1.4;
        }

        .avatar-container {
            width: clamp(64px, 15vw, 96px); 
            flex-shrink: 0;
        }

        .avatar-container img {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 1px solid var(--border-default);
            display: block;
            object-fit: cover;
        }

        .markdown-body {
            width: 100%;
            max-width: 800px;
            line-height: 1.6;
            word-wrap: break-word;
            min-height: 60vh;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .markdown-body.loaded {
            opacity: 1;
        }

        .markdown-body > *:first-child { margin-top: 0 !important; }

        .markdown-body .gh-alert { 
            padding: 12px 16px; 
            border-left: 4px solid; 
            border-radius: 8px; 
            margin: 12px 0;
        }

        .markdown-body h1, .markdown-body h2 { border-bottom: 1px solid var(--header-border); padding-bottom: 0.3em; margin-top: 16px; font-weight: 600; }
        .markdown-body code { padding: .2em .4em; background: var(--code-bg); border-radius: 6px; font-size: 85%; font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; }
        .markdown-body pre { padding: 16px; background: var(--code-bg); border-radius: 8px; overflow: auto; margin-bottom: 12px; }
        .markdown-body blockquote { margin: 8px 0; padding: 0 1em; color: var(--text-muted); border-left: 0.25em solid var(--quote-border); }
        .markdown-body .gh-alert-title { display: flex; align-items: center; font-weight: 600; font-size: 14px; margin-bottom: 4px; gap: 8px; }
        .markdown-body .gh-alert-title svg { width: 16px; height: 16px; fill: currentColor; }
        
        .loader { border: 3px solid var(--border-muted); border-top: 3px solid var(--link-color); border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1 id="site-title">Pomelo's GitHub</h1>
            <p id="site-description">专为追求Shadowrocket的终极分流效率和订阅纯度的用户而设计</p>
        </div>
        <div class="avatar-container">
            <picture>
                <source srcset="favicon-light.png" media="(prefers-color-scheme: dark)">
                <img src="favicon-dark.png" alt="Avatar">
            </picture>
        </div>
    </header>

    <div id="loader" class="loader"></div>
    <div id="content" class="markdown-body"></div>

    <script>
        const ICONS = {
            tip: `<svg viewBox="0 0 16 16"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 0 1-1.484.21c-.04-.292-.162-.52-.313-.733l-.189-.267c-.662-.803-1.343-1.745-1.343-3.105 0-2.906 2.378-5.25 5.836-5.25 2.685 0 4.836 1.838 4.836 4.418 0 1.564-.783 2.723-1.571 3.491-.397.387-.768.618-1.049.809-.276.188-.474.32-.656.626a.75.75 0 0 1-1.288-.768c.32-.536.69-.788 1.056-1.037.375-.255.858-.55 1.34-1.02.993-.968 1.668-2.227 1.668-3.419 0-1.75-1.36-3.168-3.344-3.168Zm-2.31 10.94a.75.75 0 0 1 .063 1.058A9.4 9.4 0 0 0 7.25 14.5c.677 0 1.288-.23 1.74-.636a.75.75 0 0 1 1.02 1.112A3.01 3.01 0 0 1 7.25 16c-1.258 0-2.307-.63-2.947-1.503a.75.75 0 0 1 .058-1.057Z"></path></svg>`,
            note: `<svg viewBox="0 0 16 16"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>`,
            important: `<svg viewBox="0 0 16 16"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.75.75 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>`,
            caution: `<svg viewBox="0 0 16 16"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>`,
            warning: `<svg viewBox="0 0 16 16"><path d="M6.457 1.047c.659-1.232 2.427-1.232 3.086 0l6.03 11.27c.642 1.2-.232 2.683-1.542 2.683H2.03c-1.311 0-2.185-1.483-1.543-2.683l6.03-11.27ZM8 5a.75.75 0 0 0-.75.75v3.5a.75.75 0 0 0 1.5 0v-3.5A.75.75 0 0 0 8 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path></svg>`
        };

        async function init() {
            const contentDiv = document.getElementById('content');
            const loader = document.getElementById('loader');
            try {
                const res = await fetch('./README.md?t=' + Date.now());
                if (!res.ok) throw new Error();
                const md = await res.text();
                contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(md));
                
                const map = { 'TIP':'tip','NOTE':'note','IMPORTANT':'important','CAUTION':'caution','WARNING':'warning' };
                contentDiv.querySelectorAll('blockquote').forEach(bq => {
                    const firstP = bq.querySelector('p');
                    if (!firstP) return;
                    const match = firstP.innerHTML.match(/^\[!(TIP|NOTE|IMPORTANT|CAUTION|WARNING)\]/i);
                    if (match) {
                        const type = map[match[1].toUpperCase()];
                        bq.className = `gh-alert alert-${type}`;
                        firstP.innerHTML = firstP.innerHTML.replace(/^\[!.*?\]\s*/i, '');
                        const wrapper = document.createElement('div');
                        wrapper.className = 'gh-alert-content';
                        while (bq.firstChild) wrapper.appendChild(bq.firstChild);
                        bq.innerHTML = `<div class="gh-alert-title">${ICONS[type]} ${match[1].toUpperCase()}</div>`;
                        bq.appendChild(wrapper);
                    }
                });

                loader.style.display = 'none';
                contentDiv.classList.add('loaded');
            } catch (e) {
                loader.style.display = 'none';
                contentDiv.classList.add('loaded');
                contentDiv.innerHTML = "<p style='text-align:center;'>README.md 载入失败</p>";
            }
        }
        window.onload = init;
    </script>
</body>
</html>
